name: Python CI Workflow

# Trigger the workflow on push or pull request to the main branch
on:
push:
branches: [ "main" ] pull_request:
branches: [ "main" ]

jobs:
build-and-test:
runs-on: ubuntu-latest

steps:
# Step 1: Check out your repository code onto the runner machine
-	name: Check out repository uses: actions/checkout@v4

# Step 2: Set up a Python environment
-	name: Set up Python
uses: actions/setup-python@v5 with:
python-version: '3.11'

# Step 3: Run the Python Application
-	name: Run app.py run: python app.py

# Step 4: Run Unit Tests
-	name: Run Unit Tests
run: python -m unittest test_app.py

